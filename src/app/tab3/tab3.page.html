<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Perfil
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Perfil</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header class="perfil-header">
      <ion-avatar class="perfil-avatar">
        <img alt="Avatar del estudiante" src="https://ionicframework.com/docs/img/demos/avatar.svg" />
      </ion-avatar>
      <ion-card-title>{{ studentName }}</ion-card-title>
      <ion-card-subtitle>{{ career }}</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-icon name="mail-outline" slot="start"></ion-icon>
        <ion-label>{{ email }}</ion-label>
      </ion-item>
      <ion-item>
        <ion-icon name="logo-github" slot="start"></ion-icon>
        <ion-label>{{ github }}</ion-label>
      </ion-item>
      <ion-item>
        <ion-icon name="location-outline" slot="start"></ion-icon>
        <ion-label>{{ city }}</ion-label>
      </ion-item>

      <div class="perfil-estado">
        <ion-badge [color]="isAvailable ? 'success' : 'danger'">{{ isAvailable ? 'Disponible' : 'Ocupado' }}</ion-badge>
      </div>

      <ion-button expand="block" (click)="toggleStatus()">Cambiar estado</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
